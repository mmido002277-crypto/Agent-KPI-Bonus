<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merchant-Dispute</title>
    <style>
        body { 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            margin: 0; 
            padding: 0; 
            background: linear-gradient(to right, #74ebd5, #ACB6E5); 
            color: #333; 
            line-height: 1.6;
        }
        .container { 
            max-width: 600px; 
            margin: 50px auto; 
            padding: 20px; 
            background-color: #ffffffcc;
            border-radius: 8px; 
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        h2 {
            text-align: center;
            color: #4CAF50;
            font-weight: 600;
            font-size: 2rem;
            letter-spacing: 1px;
        }
        label { 
            display: flex;
            align-items: center;
            margin-bottom: 12px; 
            font-size: 18px;
            color: #444;
            font-weight: 400;
            cursor: pointer;
        }
        label input[type="checkbox"], label input[type="radio"] {
            margin-right: 10px;
        }
        /* تنسيق الأيقونات الـ SVG الداخلية */
        .icon-svg { 
            width: 20px;
            height: 20px;
            fill: #4CAF50;
            margin-right: 10px; 
            display: inline-block;
            vertical-align: middle;
        }
        button {
            background-color: #4CAF50; 
            color: white; 
            padding: 12px 25px;
            border: none; 
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            font-size: 16px;
            font-weight: 600;
        }
        button:hover {
            background-color: #45a049;
        }
        textarea { 
            width: 97%; 
            height: 150px; 
            margin-top: 10px; 
            padding: 12px;
            font-size: 16px;
            font-family: inherit;
            border-radius: 5px;
            border: 1px solid #ccc;
            background-color: #f9f9f9;
            line-height: 1.5;
        }
        .sub-options { 
            margin-left: 30px; 
            display: none; 
        }
        .sub-options label {
            font-size: 16px;
            font-weight: 400;
        }
        .inline-input {
            padding: 4px 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            margin-left: 8px;
            width: 120px;
        }
        .reset-button {
            background-color: #FF5722;
            margin-top: 10px;
        }
        .reset-button:hover {
            background-color: #e64a19;
        }
        .footer_section {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2> Merchant Dispute </h2>
        <p>Select the options below to generate your script:</p>
        
        <!-- 1. Refund Accuracy -->
        <label>
            <input type="checkbox" value="Refund Accuracy" onclick="toggleSubOptions('refundAccuracyOptions', this)">
            <!-- أيقونة هدف SVG -->
            <svg class="icon-svg" viewBox="0 0 512 512"><path d="M256 0a256 256 0 1 0 256 256A256 256 0 0 0 256 0zm0 416a160 160 0 1 1 160-160 160 160 0 0 1-160 160zm0-256a96 96 0 1 0 96 96 96 96 0 0 0-96-96z"/></svg>
            Refund Accuracy
        </label>
        <div id="refundAccuracyOptions" class="sub-options">
            <label><input type="radio" name="refundAccuracy" value="Accurate">
                <svg class="icon-svg" viewBox="0 0 512 512"><path d="M256 8C119.033 8 8 119.033 8 256s111.033 248 248 248 248-111.033 248-248S392.967 8 256 8zm115.7 182.7l-136 136a23.9 23.9 0 0 1-33.9 0l-72-72a23.9 23.9 0 0 1 0-33.9l11.3-11.3a23.9 23.9 0 0 1 33.9 0l43.7 43.7 107.7-107.7a23.9 23.9 0 0 1 33.9 0l11.3 11.3a23.9 23.9 0 0 1 0 33.9z"/></svg>
                Accurate</label>
            <label><input type="radio" name="refundAccuracy" value="Inaccurate">
                <svg class="icon-svg" viewBox="0 0 512 512"><path d="M256 8C119 8 8 119 8 256s111 248 248 248 248-111 248-248S393 8 256 8zm121.6 313.1c4.7 4.7 4.7 12.3 0 17L338 377.6c-4.7 4.7-12.3 4.7-17 0L256 312l-65.1 65.6c-4.7 4.7-12.3 4.7-17 0L134.4 338c-4.7-4.7-4.7-12.3 0-17l65.6-65-65.6-65.1c-4.7-4.7-4.7-12.3 0-17l39.6-39.6c4.7-4.7 12.3-4.7 17 0l65 65.7 65.1-65.6c4.7-4.7 12.3-4.7 17 0l39.6 39.6c4.7 4.7 4.7 12.3 0 17L312 256l65.6 65.1z"/></svg>
                Inaccurate</label>
        </div>
        
        <!-- 2. Refund Handler -->
        <label>
            <input type="checkbox" value="Refund Handler" onclick="toggleSubOptions('refundHandlerOptions', this)">
            <svg class="icon-svg" viewBox="0 0 640 512"><path d="M610.5 373.3c2.6-14.1 2.6-28.5 0-42.6l25.8-20.1c2.3-1.8 2.9-5 1.4-7.5l-24.5-42.4c-1.5-2.6-4.7-3.6-7.3-2.5l-30.4 12.2c-9.9-7.6-21.1-13.8-33.1-18.1l-4.6-32.3c-.4-2.8-2.8-5-5.7-5h-49c-2.9 0-5.3 2.1-5.7 5l-4.6 32.3c-12 4.3-23.1 10.5-33.1 18.1l-30.4-12.2c-2.6-1-5.8 0-7.3 2.5l-24.5 42.4c-1.5 2.6-.9 5.8 1.4 7.5l25.8 20.1c-2.6 14.1-2.6 28.5 0 42.6l-25.8 20.1c-2.3 1.8-2.9 5-1.4 7.5l24.5 42.4c1.5 2.6 4.7 3.6 7.3 2.5l30.4-12.2c9.9 7.6 21.1 13.8 33.1 18.1l4.6 32.3c.4 2.8 2.8 5 5.7 5h49c2.9 0 5.3-2.1 5.7-5l4.6-32.3c12-4.3 23.1-10.5 33.1-18.1l30.4 12.2c2.6 1-5.8 0-7.3-2.5l24.5-42.4c1.5-2.6.9-5.8-1.4-7.5l-25.8-20.1zM496 384c-22.1 0-40-17.9-40-40s17.9-40 40-40 40 17.9 40 40-17.9 40-40 40zm-272-16c53 0 96-43 96-96s-43-96-96-96-96 43-96 96 43 96 96 96zm24-176h-48c-39.7 0-72 32.3-72 72v16c0 8.8 7.2 16 16 16h160c8.8 0 16-7.2 16-16v-16c0-39.7-32.3-72-72-72z"/></svg>
            Refund Handler
        </label>
        <div id="refundHandlerOptions" class="sub-options">
            <label><input type="radio" name="refundHandler" value="System Refund">
                <svg class="icon-svg" viewBox="0 0 640 512"><path d="M624 416H16c-8.8 0-16 7.2-16 16v16c0 26.5 21.5 48 48 48h544c26.5 0 48-21.5 48-48v-16c0-8.8-7.2-16-16-16zM576 48c0-26.5-21.5-48-48-48H112C85.5 0 64 21.5 64 48v288c0 26.5 21.5 48 48 48h416c26.5 0 48-21.5 48-48V48z"/></svg>
                System Refund</label>
            <label><input type="radio" name="refundHandler" value="jw_" id="jwRadio">
                <svg class="icon-svg" viewBox="0 0 576 512"><path d="M402.6 83.2l90.2 90.2c3.8 3.8 3.8 10 0 13.8L274.4 405.6l-92.8 10.3c-12.4 1.4-22.9-9.1-21.5-21.5l10.3-92.8L388.8 83.2c3.8-3.8 10-3.8 13.8 0zm162-22.9l-48.8-48.8c-15.2-15.2-39.9-15.2-55.2 0l-35.4 35.4c-3.8 3.8-3.8 10 0 13.8l90.2 90.2c3.8 3.8 10 3.8 13.8 0l35.4-35.4c15.2-15.3 15.2-40 0-55.2zM384 346.2V448H64V128h244.3c6.8 0 13.3-2.7 18.1-7.5l34-34c14.2-14.2 4.1-38.5-16-38.5H48C21.5 48 0 69.5 0 96v368c0 26.5 21.5 48 48 48h352c26.5 0 48-21.5 48-48V312.2c0-20.1-24.3-30.2-38.5-16l-34 34c-4.8 4.7-7.5 11.3-7.5 18z"/></svg>
                jw_ <input type="text" id="jwName" class="inline-input" placeholder="Enter name"></label>
        </div>

        <!-- 3. Mistaken Party -->
        <label>
            <input type="checkbox" value="Mistaken Party" onclick="toggleSubOptions('mistakenPartyOptions', this)">
            <svg class="icon-svg" viewBox="0 0 576 512"><path d="M569.517 440.013C587.975 472.007 564.806 512 527.94 512H48.054c-36.937 0-59.999-40.055-41.577-71.987L246.423 23.985c18.467-32.009 64.72-31.951 83.154 0l239.94 416.028zM288 354c-18.778 0-34 15.222-34 34s15.222 34 34 34 34-15.222 34-34-15.222-34-34-34zm22-126h-44c-11.046 0-20 8.954-20 20v64c0 11.046 8.954 20 20 20h44c11.046 0 20-8.954 20-20v64c0-11.046-8.954-20-20-20z"/></svg>
            Mistaken Party
        </label>
        <div id="mistakenPartyOptions" class="sub-options">
            <label><input type="radio" name="mistakenParty" value="Agent Mistake">
                <svg class="icon-svg" viewBox="0 0 448 512"><path d="M224 256c70.7 0 128-57.3 128-128S294.7 0 224 0 96 57.3 96 128s57.3 128 128 128zm89.6 32h-16.7c-22.2 10.2-46.9 16-72.9 16s-50.6-5.8-72.9-16h-16.7C60.2 288 0 348.2 0 422.4V464c0 26.5 21.5 48 48 48h352c26.5 0 48-21.5 48-48v-41.6c0-74.2-60.2-134.4-134.4-134.4z"/></svg>
                Agent Mistake</label>
            <label><input type="radio" name="mistakenParty" value="System Mistake">
                <svg class="icon-svg" viewBox="0 0 640 512"><path d="M320 0c17.7 0 32 14.3 32 32v16h112c35.3 0 64 28.7 64 64v192c0 35.3-28.7 64-64 64H176c-35.3 0-64-28.7-64-64V112c0-35.3 28.7-64 64-64h112V32c0-17.7 14.3-32 32-32zM192 160c0 17.7 14.3 32 32 32s32-14.3 32-32-14.3-32-32-32-32 14.3-32 32zm224 32c17.7 0 32-14.3 32-32s-14.3-32-32-32-32 14.3-32 32 14.3 32 32 32zM0 416c0-17.7 14.3-32 32-32h576c17.7 0 32 14.3 32 32v64c0 17.7-14.3 32-32 32H32c-17.7 0-32-14.3-32-32v-64z"/></svg>
                System Mistake</label>
            <label><input type="radio" name="mistakenParty" value="N/A">
                <svg class="icon-svg" viewBox="0 0 512 512"><path d="M256 8C119.034 8 8 119.033 8 256s111.034 248 248 248 248-111.033 248-248S392.967 8 256 8zm130.108 117.892c65.448 65.448 70 165.481 13.657 235.684L134.08 95.892c70.203-56.343 170.236-51.791 235.684 13.657zm-260.216 270.216c-65.448-65.448-70-165.481-13.657-235.684L377.92 416.108c-70.203 56.343-170.236 51.791-235.684-13.657z"/></svg>
                N/A</label>
        </div>
        
        <!-- 4. Refund Case -->
        <label>
            <input type="checkbox" value="Refund Case" onclick="toggleSubOptions('refundCaseOptions', this)">
            <svg class="icon-svg" viewBox="0 0 576 512"><path d="M528 64H320c-18.6 0-35.8 10.1-45 26.6L218.3 192H48c-26.5 0-48 21.5-48 48v224c0 26.5 21.5 48 48 48h480c26.5 0 48-21.5 48-48V112c0-26.5-21.5-48-48-48z"/></svg>
            Refund Case
        </label>
        <div id="refundCaseOptions" class="sub-options">
            <label><input type="radio" name="refundCase" value="CASE ID" id="caseIdRadio">
                <svg class="icon-svg" viewBox="0 0 448 512"><path d="M181.3 32.4c10.3-4.1 21.9 .9 25.9 11.3L249.4 152H344c11 0 20 9 20 20s-9 20-20 20H265.4l-32 80H328c11 0 20 9 20 20s-9 20-20 20H217.4l-42.2 105.4c-4.1 10.3-15.6 15.3-25.9 11.3s-15.3-15.6-11.3-25.9L180.3 312H96c-11 0-20-9-20-20s9-20 20-20h96.3l32-80H120c-11 0-20-9-20-20s9-20 20-20h116.3l42.2-105.4c4.1-10.3 15.6-15.3 25.9-11.3z"/></svg>
                CASE ID: <input type="text" id="caseIdNum" class="inline-input" placeholder="Enter ID"></label>
            <label><input type="radio" name="refundCase" value="N/A">
                <svg class="icon-svg" viewBox="0 0 512 512"><path d="M256 8C119.034 8 8 119.033 8 256s111.034 248 248 248 248-111.033 248-248S392.967 8 256 8zm130.108 117.892c65.448 65.448 70 165.481 13.657 235.684L134.08 95.892c70.203-56.343 170.236-51.791 235.684 13.657zm-260.216 270.216c-65.448-65.448-70-165.481-13.657-235.684L377.92 416.108c-70.203 56.343-170.236 51.791-235.684-13.657z"/></svg>
                N/A</label>
        </div>
        
        <!-- 5. Appeal Status -->
        <label>
            <input type="checkbox" value="Appeal Status" onclick="toggleSubOptions('appealStatusOptions', this)">
            <svg class="icon-svg" viewBox="0 0 512 512"><path d="M480 32H32C14.3 32 0 46.3 0 64v384c0 17.7 14.3 32 32 32h440c17.7 0 32-14.3 32-32V64c0-17.7-14.3-32-32-32zm-144 96c35.3 0 64 28.7 64 64s-28.7 64-64 64-64-28.7-64-64 28.7-64 64-64zm-115.3 240H115.3c-10.7 0-19.3-8.7-19.3-19.3v-19.3c0-31.8 25.9-57.7 57.7-57.7h51c31.8 0 57.7 25.9 57.7 57.7v19.3c0 10.7-8.6 19.3-19.3 19.3z"/></svg>
            Appeal Status
        </label>
        <div id="appealStatusOptions" class="sub-options">
            <label><input type="radio" name="appealStatus" value="Approved">
                <svg class="icon-svg" viewBox="0 0 512 512"><path d="M256 8C119.033 8 8 119.033 8 256s111.033 248 248 248 248-111.033 248-248S392.967 8 256 8zm115.7 182.7l-136 136a23.9 23.9 0 0 1-33.9 0l-72-72a23.9 23.9 0 0 1 0-33.9l11.3-11.3a23.9 23.9 0 0 1 33.9 0l43.7 43.7 107.7-107.7a23.9 23.9 0 0 1 33.9 0l11.3 11.3a23.9 23.9 0 0 1 0 33.9z"/></svg>
                Approved</label>
            <label><input type="radio" name="appealStatus" value="Rejected">
                <svg class="icon-svg" viewBox="0 0 512 512"><path d="M256 8C119 8 8 119 8 256s111 248 248 248 248-111 248-248S393 8 256 8zm121.6 313.1c4.7 4.7 4.7 12.3 0 17L338 377.6c-4.7 4.7-12.3 4.7-17 0L256 312l-65.1 65.6c-4.7 4.7-12.3 4.7-17 0L134.4 338c-4.7-4.7-4.7-12.3 0-17l65.6-65-65.6-65.1c-4.7-4.7-4.7-12.3 0-17l39.6-39.6c4.7-4.7 12.3-4.7 17 0l65 65.7 65.1-65.6c4.7-4.7 12.3-4.7 17 0l39.6 39.6c4.7 4.7 4.7 12.3 0 17L312 256l65.6 65.1z"/></svg>
                Rejected</label>
        </div>

        <!-- 6. Brief -->
        <label>
            <input type="checkbox" value="Brief:">
            <svg class="icon-svg" viewBox="0 0 448 512"><path d="M16 288h416c8.8 0 16-7.2 16-16v-32c0-8.8-7.2-16-16-16H16c-8.8 0-16 7.2-16 16v32c0 8.8 7.2 16 16 16zm0-128h416c8.8 0 16-7.2 16-16v-32c0-8.8-7.2-16-16-16H16c-8.8 0-16 7.2-16 16v32c0 8.8 7.2 16 16 16zm0 256h416c8.8 0 16-7.2 16-16v-32c0-8.8-7.2-16-16-16H16c-8.8 0-16 7.2-16 16v32c0 8.8 7.2 16 16 16z"/></svg>
            Brief
        </label><br>

        <button onclick="generateScript()">Generate Script</button>
        <button class="reset-button" onclick="resetSelections()">Reset</button>
        <textarea id="output"></textarea> <button onclick="copyToClipboard()">Copy Script</button>
    </div>
    
    <script>
        function toggleSubOptions(id, checkbox) {
            let subOptions = document.getElementById(id);
            subOptions.style.display = checkbox.checked ? "block" : "none";
        }

        function generateScript() {
            let output = document.getElementById("output");
            let script = "";

            // 1. Refund Accuracy
            if (document.querySelector('input[value="Refund Accuracy"]').checked) {
                let refundAccuracy = document.querySelector('input[name="refundAccuracy"]:checked');
                if (refundAccuracy) script += "-Refund Accuracy: " + refundAccuracy.value + "\n";
            }

            // 2. Refund Handler
            if (document.querySelector('input[value="Refund Handler"]').checked) {
                let refundHandler = document.querySelector('input[name="refundHandler"]:checked');
                if (refundHandler) {
                    if (refundHandler.value === "jw_") {
                        let nameInput = document.getElementById("jwName").value;
                        script += "-Refund Handler: " + nameInput + "\n";
                    } else {
                        script += "-Refund Handler: " + refundHandler.value + "\n";
                    }
                }
            }

            // 3. Mistaken Party
            if (document.querySelector('input[value="Mistaken Party"]').checked) {
                let mistakenParty = document.querySelector('input[name="mistakenParty"]:checked');
                if (mistakenParty) script += "-Mistaken Party: " + mistakenParty.value + "\n";
            }
            
            // 4. Refund Case
            if (document.querySelector('input[value="Refund Case"]').checked) {
                let refundCase = document.querySelector('input[name="refundCase"]:checked');
                if (refundCase) {
                    if (refundCase.value === "CASE ID") {
                        let caseIdNum = document.getElementById("caseIdNum").value;
                        script += "-Refund Case: " + caseIdNum + "\n";
                    } else {
                        script += "-Refund Case: " + refundCase.value + "\n";
                    }
                }
            }

            // 5. Appeal Status
            if (document.querySelector('input[value="Appeal Status"]').checked) {
                let appealStatus = document.querySelector('input[name="appealStatus"]:checked');
                if (appealStatus) script += "-Appeal Status: " + appealStatus.value + "\n";
            }

            // 6. Brief
            if (document.querySelector('input[value="Brief:"]').checked) {
                script += "-Brief:\n";
            }

            output.value = script;
        }

        function copyToClipboard() {
            let output = document.getElementById("output");
            output.select();
            document.execCommand("copy");
            alert("Template copied ✅");
        }

        function resetSelections() {
            document.querySelectorAll('input[type="checkbox"]').forEach(checkbox => checkbox.checked = false);
            document.querySelectorAll('input[type="radio"]').forEach(radio => radio.checked = false);
            document.querySelectorAll('input[type="text"]').forEach(input => input.value = '');
            document.querySelectorAll('.sub-options').forEach(subOptions => subOptions.style.display = 'none');
            document.getElementById("output").value = "";
        }
    </script>
<section class="container-fluid footer_section">
    <p>&copy; All Rights Reserved By Mohamed Hassan (Mido)</p>
  </section>
</body>
</html>
