<title>Agent KPI Tool</title>

<style>
* { box-sizing: border-box; }

body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  margin: 0;
  padding: 20px;
  background: linear-gradient(to right, #74ebd5, #ACB6E5);
  color: #333;
  line-height: 1.6;
}

/* LOGIN PAGE */
#loginPage {
  min-height: calc(100vh - 40px);
  display: flex;
  align-items: center;
  justify-content: center;
}

.login-container {
  width: 100%;
  max-width: 420px;
  background: white;
  padding: 35px;
  border-radius: 15px;
  box-shadow: 0 5px 25px rgba(0,0,0,.18);
  text-align: center;
}

.login-logo {
  margin-bottom: 25px;
}

.login-logo svg {
  width: 100%;
  max-width: 280px;
  height: 105px;
  border-radius: 8px;
}

.login-container h2 {
  color: #1a73e8;
  margin: 0 0 8px;
  font-size: 25px;
}

.login-subtitle {
  color: #777;
  font-size: 14px;
  margin-bottom: 25px;
}

.login-container label {
  display: block;
  text-align: left;
  font-weight: bold;
  margin: 15px 0 5px;
}

.login-container input {
  width: 100%;
  padding: 13px;
  border: 2px solid #e0e0e0;
  border-radius: 8px;
  font-size: 16px;
  outline: none;
}

.login-container input:focus {
  border-color: #1a73e8;
}

.password-wrapper {
  position: relative;
}

.password-wrapper input {
  padding-right: 65px;
}

.toggle-password {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  border: none;
  background: none;
  color: #1a73e8;
  cursor: pointer;
  font-weight: bold;
}

.login-btn {
  width: 100%;
  padding: 13px;
  margin-top: 25px;
  background: #1a73e8;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  transition: .3s;
}

.login-btn:hover {
  background: #1558b0;
}

.login-error {
  color: #d93025;
  font-size: 14px;
  margin-top: 15px;
  min-height: 22px;
}

.login-footer {
  margin-top: 25px;
  font-size: 12px;
  color: #999;
}

/* MAIN WEBSITE */
#mainContent {
  display: none;
}

.logo-container {
  text-align: center;
  margin: 10px auto;
  width: 100%;
  max-width: 950px;
  height: 250px;
}

.logo-container svg {
  width: 100%;
  height: 100%;
  border-radius: 10px;
  box-shadow: 0 4px 10px rgba(0,0,0,.15);
}

.container {
  max-width: 1200px;
  margin: 30px auto;
  background: white;
  padding: 25px;
  border-radius: 12px;
  box-shadow: 0 4px 20px rgba(0,0,0,.15);
}

h2 {
  margin: 0 0 25px;
  color: #1a73e8;
  font-size: 24px;
  text-align: center;
}

.input-group { margin-bottom: 20px; }

label {
  font-weight: bold;
  display: block;
  margin-top: 15px;
  color: #444;
}

input {
  width: 100%;
  padding: 12px 15px;
  border: 2px solid #e0e0e0;
  border-radius: 8px;
  font-size: 16px;
  outline: none;
  margin-top: 5px;
}

input:focus { border-color: #1a73e8; }

.result-card {
  margin-top: 25px;
  padding: 20px;
  border-radius: 10px;
  background: #fafafa;
  border: 1px solid #e8e8e8;
  display: none;
}

.agent-header {
  background: #e8f0fe;
  padding: 12px 16px;
  border-radius: 8px;
  margin-bottom: 20px;
  border-left: 5px solid #1a73e8;
}

.agent-name {
  font-size: 18px;
  font-weight: bold;
  color: #1967d2;
}

.table-wrapper {
  width: 100%;
  overflow-x: auto;
  border-radius: 8px;
}

table {
  width: 100%;
  min-width: 1100px;
  border-collapse: collapse;
  margin-top: 15px;
  font-size: 13px;
  background: white;
}

th, td {
  border: 1px solid #d0d0d0;
  padding: 11px 10px;
  text-align: center;
  vertical-align: middle;
  white-space: nowrap;
}

th {
  background: #1a73e8;
  color: white;
  font-weight: 600;
}

tbody tr:nth-child(even) { background: #f2f6fc; }

tbody tr:hover { background: #e8f0fe; }

.kpi-name {
  text-align: left;
  font-weight: bold;
  color: #1967d2;
  background: #e8f0fe;
}

.bonus-cell {
  font-weight: bold;
  color: #137333;
}

.abs-summary-row td {
  background: #e6f4ea;
  font-weight: bold;
  color: #137333;
}

.abs-summary-label {
  text-align: left;
  color: #137333 !important;
  background: #ceead6 !important;
}

.final-bonus-box {
  margin-top: 20px;
  padding: 18px 20px;
  background: #e6f4ea;
  border: 1px solid #ceead6;
  border-radius: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  color: #137333;
  font-size: 17px;
  font-weight: bold;
}

.final-bonus-box strong {
  font-size: 23px;
}

.status {
  margin-top: 15px;
  color: #d93025;
  font-size: 14px;
  text-align: center;
  font-weight: 500;
}

/* LOGOUT */
.top-bar {
  max-width: 1200px;
  margin: 10px auto;
  display: flex;
  justify-content: flex-end;
}

.logout-btn {
  background: #d93025;
  color: white;
  border: none;
  padding: 10px 20px;
  border-radius: 7px;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
  transition: .3s;
}

.logout-btn:hover {
  background: #b3261e;
}

@media(max-width:600px) {
  body { padding: 10px; }

  .container { padding: 15px; }

  h2 { font-size: 20px; }

  .logo-container { height: 120px; }

  .final-bonus-box {
    font-size: 14px;
    padding: 15px;
  }

  .final-bonus-box strong {
    font-size: 20px;
  }

  .login-container {
    padding: 25px 20px;
  }
}
</style>

      <svg viewBox="0 0 400 150" xmlns="http://www.w3.org/2000/svg">
        <rect x="0" y="0" width="400" height="95" fill="#FFDE00"/>

    <div class="login-subtitle">Please login to access Agent KPI Tool</div>

        id="username"
        placeholder="Enter your username"
        autocomplete="username"

          id="password"
          placeholder="Enter your password"
          autocomplete="current-password"

          class="toggle-password"
          onclick="togglePassword()"

      </button>

      <div id="loginError" class="login-error"></div>

    </form>

    <div class="login-footer">
      © Agent KPI &amp; Bonus Tool
    </div>

  </div>

</div>

<!-- MAIN WEBSITE -->

        Agent KPI &amp; Bonus Tool

    </svg>
  </div>

  <div class="container">

    <h2>Agent KPI &amp; Bonus Tool Sep / 9</h2>

    <div class="input-group">
      <label for="ccmsInput">Enter CCMS ID:</label>

        type="text"
        id="ccmsInput"
        placeholder="Enter Number"
        oninput="searchAgent()"

    </div>

      <div class="agent-header">
        <div class="agent-name" id="resName">-</div>
        <div style="font-size:13px;color:#5f6368;margin-top:4px;">

        </div>
      </div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>

              <th>Actual</th>
              <th>Target</th>
              <th>Cap</th>
              <th>Weight</th>
              <th>Bonus</th>

              <th>Bonus After ABS%</th>

            </tr>
          </thead>

          <tbody id="kpiTableBody"></tbody>
        </table>
      </div>

      <div class="final-bonus-box">
        <span>Final Bonus After Deduction:</span>
        <strong id="finalBonusValue">-</strong>
      </div>

    </div>

    <div id="status" class="status"></div>

  </div>

</div>

<script>

/* LOGIN SETTINGS */

const USERNAME = "1";
const PASSWORD = "123";

function checkLogin() {

  const user = document.getElementById("username").value.trim();
  const pass = document.getElementById("password").value;

  const error = document.getElementById("loginError");

  if (user === USERNAME && pass === PASSWORD) {

    sessionStorage.setItem("isLoggedIn", "true");

    error.textContent = "";

    showMainContent();

  } else {

    error.textContent = "Invalid Username or Password!";

  }

}

function togglePassword() {

  const passwordInput = document.getElementById("password");
  const toggleBtn = document.getElementById("toggleBtn");

  if (passwordInput.type === "password") {

    passwordInput.type = "text";
    toggleBtn.textContent = "Hide";

  } else {

    passwordInput.type = "password";
    toggleBtn.textContent = "Show";

  }

}

function showMainContent() {

  document.getElementById("loginPage").style.display = "none";
  document.getElementById("mainContent").style.display = "block";

}

function logout() {

  sessionStorage.removeItem("isLoggedIn");

  document.getElementById("ccmsInput").value = "";
  document.getElementById("result").style.display = "none";
  document.getElementById("status").textContent = "";

  document.getElementById("username").value = "";
  document.getElementById("password").value = "";

  document.getElementById("mainContent").style.display = "none";
  document.getElementById("loginPage").style.display = "flex";

  document.getElementById("loginError").textContent = "";

}

window.addEventListener("DOMContentLoaded", function() {

  if (sessionStorage.getItem("isLoggedIn") === "true") {
    showMainContent();
  } else {
    document.getElementById("loginPage").style.display = "flex";
    document.getElementById("mainContent").style.display = "none";
  }

});

/* AGENT SEARCH */

function searchAgent() {

  const query = document.getElementById("ccmsInput").value.trim();
  const resultCard = document.getElementById("result");
  const statusDiv = document.getElementById("status");
  const tbody = document.getElementById("kpiTableBody");

  if (!query) {
    resultCard.style.display = "none";
    statusDiv.textContent = "";
    return;
  }

  const agent = database.find(item => item.ccms === query);

  if (!agent) {
    resultCard.style.display = "none";
    statusDiv.textContent = "No Agent found with this CCMS ID.";
    return;
  }

  statusDiv.textContent = "";

  document.getElementById("resName").textContent = agent.name;
  document.getElementById("resCCMS").textContent = agent.ccms;

  tbody.innerHTML = "";

  const kpis = [
    { key: "csat", name: "C-SAT" },
    { key: "dsat", name: "D-SAT" },
    { key: "adaption", name: "Adaption Rate" },
    { key: "ut", name: "UT%" },
    { key: "aht", name: "AHT" }
  ];

  kpis.forEach(kpi => {

    const data = agent[kpi.key];

    if (!data) return;

    const row = document.createElement("tr");

    const values = [
      kpi.name,
      ...data
    ];

    values.forEach((value, index) => {

      const cell = document.createElement("td");
      cell.textContent = value ?? "";

      if (index === 0) cell.className = "kpi-name";
      if (index === 5) cell.className = "bonus-cell";

      row.appendChild(cell);

    });

    for (let i = 0; i < 4; i++) {
      const cell = document.createElement("td");
      cell.textContent = "";
      row.appendChild(cell);
    }

    tbody.appendChild(row);

  });

  const absRow = document.createElement("tr");
  absRow.className = "abs-summary-row";

  const labelCell = document.createElement("td");
  labelCell.colSpan = 6;
  labelCell.textContent = "ABS & Deduction Summary";
  labelCell.className = "abs-summary-label";
  absRow.appendChild(labelCell);

  (agent.abs || []).slice(0, 4).forEach(value => {

    const cell = document.createElement("td");
    cell.textContent = value ?? "";
    absRow.appendChild(cell);

  });

  tbody.appendChild(absRow);

  document.getElementById("finalBonusValue").textContent =
    agent.abs?.[4] ?? "-";

  resultCard.style.display = "block";

}

</script>
