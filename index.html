<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent KPI Tool</title>
  <style>
    * { box-sizing: border-box; }
    body { 
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; 
      margin: 0; 
      padding: 20px; 
      background: linear-gradient(to right, #74ebd5, #ACB6E5); 
      color: #333; 
      line-height: 1.6;
      direction: ltr;
      text-align: left;
    }
    
    .logo-container {
      text-align: center;
      margin: 10px auto 10px auto;
      width: 100%;       
      max-width: 850px;  
      height: 150px;     
    }
    .logo-container svg {
      width: 100%;
      height: 100%;
      border-radius: 10px; 
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    .container {
      max-width: 950px;
      margin: 30px auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }

    h2 { 
      margin-top: 0; 
      color: #1a73e8; 
      font-size: 24px; 
      text-align: center; 
      margin-bottom: 25px; 
    }

    .input-group { 
      margin-bottom: 20px; 
    }

    label { 
      font-weight: bold; 
      display: block; 
      margin-top: 15px; 
      color: #444; 
    }

    input { 
      width: 100%; 
      padding: 12px 15px; 
      border: 2px solid #e0e0e0; 
      border-radius: 8px; 
      font-size: 16px; 
      transition: border-color 0.2s; 
      outline: none; 
      margin-top: 5px;
    }
    input:focus { 
      border-color: #1a73e8; 
    }

    .result-card { 
      margin-top: 25px; 
      padding: 20px; 
      border-radius: 10px; 
      background: #fafafa; 
      border: 1px solid #e8e8e8; 
      display: none; 
    }

    .agent-header { 
      background: #e8f0fe; 
      padding: 12px 16px; 
      border-radius: 8px; 
      margin-bottom: 20px; 
      border-left: 5px solid #1a73e8; 
    }
    .agent-name { 
      font-size: 18px; 
      font-weight: bold; 
      color: #1967d2; 
    }

    table { 
      width: 100%; 
      border-collapse: collapse; 
      margin-top: 15px; 
      font-size: 14px; 
      background: #fff; 
      border-radius: 8px; 
      overflow: hidden; 
    }
    th, td { 
      border: 1px solid #d0d0d0; 
      padding: 10px 12px; 
      text-align: center; 
      vertical-align: middle; 
    }
    th { 
      background-color: #1a73e8; 
      color: white; 
      font-weight: 600; 
    }
    tr:nth-child(even) {
      background-color: #f9f9f9;
    }
    .kpi-name { 
      text-align: left; 
      font-weight: 600; 
      color: #202124; 
    }

    .status { 
      margin-top: 15px; 
      color: #d93025; 
      font-size: 14px; 
      text-align: center; 
      font-weight: 500; 
    }

    .bonus-box { 
      background: #e6f4ea; 
      padding: 15px 20px; 
      border-radius: 8px; 
      border: 1px solid #ceead6; 
      margin-top: 20px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
    }
    .bonus-label { 
      font-weight: bold; 
      color: #137333; 
      font-size: 16px; 
    }
    .bonus-value { 
      font-weight: bold; 
      color: #137333; 
      font-size: 22px; 
    }
  </style>
</head>

  function searchAgent() {
    const query = document.getElementById('ccmsInput').value.trim();
    const resultCard = document.getElementById('result');
    const statusDiv = document.getElementById('status');
    const tbody = document.getElementById('kpiTableBody');

    if (!query) {
      resultCard.style.display = 'none';
      statusDiv.textContent = '';
      return;
    }

    const agent = database.find(item => item.ccms === query);

    if (agent) {
      statusDiv.textContent = '';
      document.getElementById('resName').textContent = agent.name;
      document.getElementById('resCCMS').textContent = agent.ccms;
      document.getElementById('resSurveys').textContent = agent.surveys;
      document.getElementById('resBonus').textContent = agent.finalBonus;

      tbody.innerHTML = '';
      const kpis = [
        { key: 'csat', name: 'CSAT' },
        { key: 'dsat', name: 'DSAT' },
        { key: 'fcr', name: 'FCR' },
        { key: 'adaption', name: 'Adaptability / Attendance' },
        { key: 'accuracy', name: 'Quality Accuracy' },
        { key: 'ut', name: 'Utilization (UT)' },
        { key: 'art', name: 'Average Response Time (ART)' },
        { key: 'aht', name: 'Average Handling Time (AHT)' }
      ];

      kpis.forEach(kpi => {
        if (agent[kpi.key]) {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td class="kpi-name">${kpi.name}</td>
            <td>${agent[kpi.key].act}</td>
            <td>${agent[kpi.key].target}</td>
            <td>${agent[kpi.key].cap}</td>
            <td>${agent[kpi.key].wt}</td>
            <td>${agent[kpi.key].bn}</td>
          `;
          tbody.appendChild(row);
        }
      });

      resultCard.style.display = 'block';
    } else {
      resultCard.style.display = 'none';
      statusDiv.textContent = 'No Agent found with this CCMS ID.';
    }
  }
</script>
